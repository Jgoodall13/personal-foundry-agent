# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

infra:
    provider: microsoft.foundry
name: langgraph-chat-responses
requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
services:
    ai-project:
        deployments:
            - model:
                format: OpenAI
                name: gpt-6.1-sol
                version: "2026-03-17"
              name: gpt-6.1-sol
              sku:
                capacity: 10
                name: GlobalStandard
        endpoint: https://aif-hosted-with-rag-resource.services.ai.azure.com/api/projects/proj-hosted-with-rag
        host: azure.ai.project
    langgraph-chat-responses:
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: 'Multi-turn chat agent built with LangGraph and hosted on Foundry over the Responses protocol using langchain_azure_ai.agents.hosting. Includes local tools: get_current_time. Server-side conversation state via previous_response_id.'
        displayName: LangGraph Chat (Responses)
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            PYTHONNOUSERSITE: "1"
        host: azure.ai.agent
        kind: hosted
        language: python
        metadata:
            tags:
                - AI Agent Hosting
                - Responses Protocol
                - LangGraph
                - LangChain
                - Tool Calling
                - Python
        name: langgraph-chat-responses
        project: src/langgraph-chat-responses
        protocols:
            - protocol: responses
              version: 2.0.0
        uses:
            - ai-project
